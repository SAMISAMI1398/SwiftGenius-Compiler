name: Deploy SwiftWebUI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Public Folder
        run: |
          mkdir -p public
          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <script src="https://cdn.tailwindcss.com"></script>
              <style>
                  body { background: #000; color: white; font-family: -apple-system, sans-serif; }
                  .ios-card { background: #1c1c1e; border-radius: 30px; padding: 25px; border: 1px solid #333; height: 100vh; }
                  .swift-btn { background: #007AFF; border-radius: 12px; padding: 15px; text-align: center; font-weight: 600; width: 100%; margin-top: 20px; }
              </style>
          </head>
          <body class="p-4">
              <div class="ios-card w-full shadow-2xl flex flex-col items-center justify-center">
                  <div id="render" class="space-y-6 text-center w-full">
                      </div>
              </div>
              <script>
                  const code = \`$(cat ContentView.swift)\`;
                  const output = document.getElementById('render');
                  
                  // Extracteur de texte SwiftUI
                  const textMatch = code.match(/Text\("([^"]+)"\)/);
                  if(textMatch) {
                      output.innerHTML += \`<p class="text-3xl font-bold">\${textMatch[1]}</p>\`;
                  }
                  
                  // Extracteur de bouton SwiftUI
                  if(code.includes('Button')) {
                      output.innerHTML += \`<div class="swift-btn">Action SwiftUI</div>\`;
                  }
              </script>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
